<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cargando plataforma...</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; color: #333; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 2s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Redirigiendo a la web...</p>
    
    <script>
        // TU URL DE GOOGLE APPS SCRIPT
        var destination = "https://script.google.com/macros/s/AKfycbxHGyIPlc3nlKxc9F4D2PHufBQ2Bmu1chOH3gfC7te9PTJM3J2qua17QCFZxLI8U1WY/exec";

        // Forzamos la redirección de tres formas distintas para asegurar compatibilidad
        window.onload = function() {
            window.location.replace(destination);
        };
        
        // Respaldo por si el onload falla
        setTimeout(function() {
            window.location.href = destination;
        }, 500);
    </script>
    
    <noscript>
        <p>Parece que JavaScript está desactivado. <a href="https://script.google.com/macros/s/AKfycbxHGyIPlc3nlKxc9F4D2PHufBQ2Bmu1chOH3gfC7te9PTJM3J2qua17QCFZxLI8U1WY/exec">Haz clic aquí para entrar</a>.</p>
    </noscript>
</body>
</html>
